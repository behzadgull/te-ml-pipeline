# Paper B family rules: stoichiometric-template matching from composition alone
# (methodology doc, section 2.2 and 7 (d)). DRAFT 2026-09-26, awaiting review;
# not committed.
#
# What is matched: the HOST formula, i.e. the snapfix `chemistry_cluster_id`
# (dopants below 5 at% already removed, near-integer amounts snapped), parsed
# with pymatgen. Family is therefore constant within a chemistry cluster.
#
# Rules are tried in order and the FIRST match wins. A host that matches no
# rule is labelled `unassignable_label`; it is reported, never dropped.
#
# rule type `site_ratio`:
#   Each site lists the elements allowed on it and a `count` (its share of the
#   formula unit, e.g. 2 for the A site of A2X3). A host matches when
#     1. every atom of the host is an element listed on some site of the rule
#        (element sets are disjoint within a rule, so each atom has one site);
#     2. every required site holds a positive amount;
#     3. dividing each required site's total amount by its `count`, the largest
#        and smallest results differ by at most `tolerance` of their mean, that
#        is (max - min) / mean <= tolerance;
#     4. an `optional` site (e.g. a filler) holds at most `max_atom_fraction`
#        of all atoms; it is excluded from the ratio in 3.
#   Solid solutions are handled by pooling: Hf0.5Zr0.5NiSn puts 1.0 on the X
#   site of a half-Heusler.
# rule type `element_fraction`:
#   A host matches when the atom fraction of `element` is at least
#   `min_atom_fraction`.
#
# Tolerances are set from the rule's physics, not tuned to counts:
# 0.10 by default; 0.20 for Cu2X / Ag2X because Cu2-xSe and Cu2-xS are
# routinely Cu-deficient by 10 to 20%.

schema_version: 1
unassignable_label: unassignable

rules:
  - name: tetradymite
    description: Tetradymite (Bi,Sb)2(Te,Se,S)3
    type: site_ratio
    tolerance: 0.10
    sites:
      - {site: A, elements: [Bi, Sb], count: 2}
      - {site: X, elements: [Te, Se, S], count: 3}

  - name: iv_vi_rocksalt
    description: IV-VI 1:1 (Pb,Sn,Ge)(Te,Se,S)
    type: site_ratio
    tolerance: 0.10
    sites:
      - {site: A, elements: [Pb, Sn, Ge], count: 1}
      - {site: X, elements: [Te, Se, S], count: 1}

  - name: skutterudite
    description: Skutterudite (Co,Rh,Ir,Fe,Ni)(Sb,As,P)3, optionally filled
    type: site_ratio
    tolerance: 0.10
    sites:
      - {site: M, elements: [Co, Rh, Ir, Fe, Ni], count: 1}
      - {site: X, elements: [Sb, As, P], count: 3}
      - {site: filler, elements: [La, Ce, Pr, Nd, Sm, Eu, Gd, Yb, Ba, Sr, Ca, In, Tl, Ga, Na, K],
         optional: true, max_atom_fraction: 0.08}

  - name: half_heusler
    description: Half-Heusler XYZ 1:1:1
    type: site_ratio
    tolerance: 0.10
    sites:
      - {site: X, elements: [Sc, Y, La, Gd, Dy, Ho, Er, Tm, Lu, Ti, Zr, Hf, V, Nb, Ta], count: 1}
      - {site: Y, elements: [Mn, Fe, Co, Ni, Ru, Rh, Ir, Pd, Pt], count: 1}
      - {site: Z, elements: [Sn, Sb, Bi, Pb, Ge, Si], count: 1}

  - name: mg2x
    description: Mg2(Si,Ge,Sn)
    type: site_ratio
    tolerance: 0.10
    sites:
      - {site: A, elements: [Mg], count: 2}
      - {site: X, elements: [Si, Ge, Sn], count: 1}

  - name: mg3x2_zintl
    description: Mg3(Sb,Bi)2-type Zintl
    type: site_ratio
    tolerance: 0.10
    sites:
      - {site: A, elements: [Mg], count: 3}
      - {site: X, elements: [Sb, Bi], count: 2}

  - name: cu2x_ag2x_liquid_like
    description: Cu2/Ag2 (Se,S,Te) liquid-like
    type: site_ratio
    tolerance: 0.20
    sites:
      - {site: A, elements: [Cu, Ag], count: 2}
      - {site: X, elements: [Se, S, Te], count: 1}

  - name: zintl_122
    description: 1-2-2 Zintl AB2X2
    type: site_ratio
    tolerance: 0.10
    sites:
      - {site: A, elements: [Ca, Sr, Ba, Eu, Yb], count: 1}
      - {site: B, elements: [Mg, Zn, Cd, Mn], count: 2}
      - {site: X, elements: [Sb, Bi, As], count: 2}

  - name: clathrate_type_i
    description: Type-I clathrate A8B16C30
    type: site_ratio
    tolerance: 0.10
    sites:
      - {site: A, elements: [Ba, Sr, Eu, Cs, K, Na], count: 8}
      - {site: B, elements: [Ga, Al, In, Zn, Cd, Cu, Ni, Ag, Au], count: 16}
      - {site: C, elements: [Ge, Si, Sn], count: 30}

  - name: tetrahedrite
    description: Tetrahedrite Cu12Sb4S13
    type: site_ratio
    tolerance: 0.10
    sites:
      - {site: M, elements: [Cu, Zn, Fe, Ni, Mn, Co, Ag], count: 12}
      - {site: Pn, elements: [Sb, As, Bi], count: 4}
      - {site: Ch, elements: [S, Se], count: 13}

  - name: bicuseo
    description: BiCuSeO-type oxychalcogenide
    type: site_ratio
    tolerance: 0.10
    sites:
      - {site: A, elements: [Bi, La, Pb, Ba, Sr, Ca], count: 1}
      - {site: B, elements: [Cu, Ag], count: 1}
      - {site: X, elements: [Se, Te, S], count: 1}
      - {site: O, elements: [O], count: 1}

  # Checked last, after every specific rule above.
  - name: oxide
    description: Oxide (oxygen at or above one atom in five)
    type: element_fraction
    element: O
    min_atom_fraction: 0.20
